# Quantumult X — httpjs 本地脚本
# 把 network-info.js / server-info.js / streaming-check.js
# 复制到「Quantumult X / Scripts」后，将下面片段合并进配置。

[dns]
# 让 Safari 能发出 http://httpjs.local/... ，由 rewrite 截获，无需真实站点
alias = httpjs.local, 127.0.0.1

[filter_local]
host, httpjs.local, direct

[rewrite_local]
# HTTP Request：script-echo-response 直接由脚本生成响应
^http://httpjs\.local/network url script-echo-response network-info.js
^http://httpjs\.local/risk url script-echo-response server-info.js
^http://httpjs\.local/stream url script-echo-response streaming-check.js

[task_local]
# 原 sample.txt 的长按节点交互，改为读本地脚本
event-interaction network-info.js, tag=网络信息, img-url=https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/Color/Global.png, enabled=true
event-interaction server-info.js, tag=节点風險详情, img-url=https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/Color/WiFi.png, enabled=true
event-interaction streaming-check.js, tag=流媒体解锁查询, img-url=https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/Color/Siri.png, enabled=true

# Safari 打开（QX 隧道需开启）：
#   http://httpjs.local/network
#   http://httpjs.local/network?policy=节点名
#   http://httpjs.local/risk?format=json
#   http://httpjs.local/stream?policy=节点名
