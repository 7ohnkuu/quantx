# Quantumult X — httpjs local scripts
# Copy network-info.js, server-info.js, streaming-check.js, speed-test.js, and ai-check.js
# into Quantumult X / Scripts, then merge this snippet into your profile.

[dns]
# So Safari can request http://httpjs.local/... and rewrite can intercept it
alias = httpjs.local, 127.0.0.1

[filter_local]
host, httpjs.local, direct

[rewrite_local]
# HTTP Request: script-echo-response builds the response in-script
^http://httpjs\.local/network url script-echo-response network-info.js
^http://httpjs\.local/risk url script-echo-response server-info.js
^http://httpjs\.local/stream url script-echo-response streaming-check.js
^http://httpjs\.local/speed url script-echo-response speed-test.js
^http://httpjs\.local/ai url script-echo-response ai-check.js

[task_local]
# Node long-press actions (local copies of the sample.txt remotes)
event-interaction network-info.js, tag=Network Info, img-url=https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/Color/Global.png, enabled=true
event-interaction server-info.js, tag=Node Risk, img-url=https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/Color/WiFi.png, enabled=true
event-interaction streaming-check.js, tag=Streaming Unlock, img-url=https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/Color/Siri.png, enabled=true
event-interaction speed-test.js, tag=Speed Test, img-url=https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/Color/Speedtest.png, enabled=true
event-interaction ai-check.js, tag=AI Models, img-url=https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/Color/ChatGPT.png, enabled=true

# Open in Safari with the Quantumult X tunnel running:
#   http://httpjs.local/network
#   http://httpjs.local/network?policy=NodeName
#   http://httpjs.local/risk?format=json
#   http://httpjs.local/stream?policy=NodeName
#   http://httpjs.local/speed
#   http://httpjs.local/speed?policy=NodeName&size=5
#   http://httpjs.local/ai
#   http://httpjs.local/ai?policy=NodeName
